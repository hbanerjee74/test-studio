# Studio-owned DuckDB-local dbt profile (VD-3815). Both database locations are
# deployment-specific absolute paths delivered by the Runtime Location Contract
# env — never a literal path, never a workspace-relative file.
#
# The ephemeral file is a copy of the read-only Domain database, so dev needs no
# Domain attachment or production manifest to see the baseline data.
dbt_duckdb_local:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('VD_EPHM_DUCKDB_LOCAL_PATH') }}"
      schema: "{{ env_var('VD_EPHM_SCHEMA') }}"
      threads: 4

    prod:
      type: duckdb
      path: "{{ env_var('VD_DOMAIN_DUCKDB_LOCAL_PATH') }}"
      schema: "{{ env_var('VD_DOMAIN_SCHEMA') }}"
      threads: 4
